site_name: Edictum Console
site_description: Self-hostable operations console for governed AI agents
site_url: https://console-docs.edictum.dev/
repo_url: https://github.com/acartag7/edictum-console
repo_name: acartag7/edictum-console

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Concepts:
    - How It Works: concepts/how-it-works.md
    - Contract Model: concepts/contracts.md
    - Live Hot-Reload: concepts/hot-reload.md
    - Approvals: concepts/approvals.md
    - Security Model: concepts/security-model.md
  - Guides:
    - Self-Hosting: guides/self-hosting.md
    - Connecting Agents: guides/connecting-agents.md
    - Managing Contracts: guides/managing-contracts.md
    - Notifications:
      - Overview: guides/notifications/overview.md
      - Telegram: guides/notifications/telegram.md
      - Slack: guides/notifications/slack.md
      - Discord: guides/notifications/discord.md
      - Webhook: guides/notifications/webhook.md
      - Email: guides/notifications/email.md
    - Fleet Monitoring: guides/fleet-monitoring.md
    - Agent Assignment: guides/agent-assignment.md
    - AI Assistant: guides/ai-assistant.md
    - Dashboard Guide: guides/dashboard-overview.md
  - Reference:
    - API: reference/api.md
    - Environment Variables: reference/environment-variables.md
    - Database: reference/database.md
    - SSE Events: reference/sse-events.md
    - SDK Compatibility: reference/sdk-compat.md
  - Architecture: architecture.md
  - Roadmap: roadmap.md
